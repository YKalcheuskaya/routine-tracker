name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Confirm runtime
        run: |
          node -p "process.version + ' ' + process.arch"
          npm --version
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start and configure local Supabase
        id: infrastructure
        run: |
          if ! npm run supabase:start >"$RUNNER_TEMP/supabase-start.log" 2>&1; then
            echo "Local Supabase failed to start; credential-bearing output was withheld."
            exit 1
          fi
          npx supabase db reset --local --no-seed
          npm run supabase:env
      - name: Run full verification gate
        id: verification
        run: npm run verify:full
      - name: Write verification summary
        if: always()
        run: |
          {
            echo "## Routine Tracker verification"
            echo
            echo "| Check | Outcome |"
            echo "| --- | --- |"
            echo "| Local Supabase and migration | ${{ steps.infrastructure.outcome }} |"
            echo "| Full verification gate | ${{ steps.verification.outcome }} |"
            echo
            echo "The downloadable \`playwright-report\` artifact contains the HTML report, JUnit XML, and failure diagnostics when present."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload browser reports and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Stop local Supabase
        if: always()
        continue-on-error: true
        run: npm run supabase:stop >"$RUNNER_TEMP/supabase-stop.log" 2>&1

  deploy-preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and inspect credential-free guest preview
        run: npm run verify:pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy guest preview
        id: deployment
        uses: actions/deploy-pages@v4
